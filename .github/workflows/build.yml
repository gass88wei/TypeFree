name: Build TypeFree

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    # tag push 只做发布（复用 main 最新成功构建），不重复构建
    if: github.ref_type != 'tag'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install CMake 4.0.2 (pinned by :rime module)
        run: |
          pip3 install --quiet cmake==4.0.2 || {
            curl -L --retry 3 -C - -o /tmp/cmake.tar.gz \
              https://github.com/Kitware/CMake/releases/download/v4.0.2/cmake-4.0.2-linux-x86_64.tar.gz
            tar -xzf /tmp/cmake.tar.gz -C /opt
            echo "/opt/cmake-4.0.2-linux-x86_64/bin" >> "$GITHUB_PATH"
          }
          cmake --version
          cmake --version | grep -q "4.0.2" || { echo "CMake 4.0.2 not on PATH"; exit 1; }

      - name: Fetch local ASR build deps (sherpa-onnx AAR + SenseVoice-Small int8 + silero VAD)
        run: |
          mkdir -p app/libs local_sherpa
          curl -L --retry 3 --retry-delay 5 -C - -o app/libs/sherpa-onnx-2.0.1.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          curl -L --retry 3 --retry-delay 5 -C - -o /tmp/sensevoice.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09.tar.bz2
          tar -xjf /tmp/sensevoice.tar.bz2 -C /tmp
          cp "/tmp/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/model.int8.onnx" local_sherpa/
          cp "/tmp/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2025-09-09/tokens.txt" local_sherpa/
          curl -L --retry 3 --retry-delay 5 -C - -o local_sherpa/silero_vad.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          test -s app/libs/sherpa-onnx-2.0.1.aar
          test -s local_sherpa/model.int8.onnx
          test -s local_sherpa/tokens.txt
          test -s local_sherpa/silero_vad.onnx

      - name: Build APK (release, debug-signed fallback)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Smoke-check APK (launchability + GLIBC guard, exits 1 on failure)
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Checking $APK"
          unzip -t "$APK" > /dev/null
          BADGING="$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -E "^package: name='com.typefree.ime'"
          echo "$BADGING" | grep -E "native-code: .*arm64-v8a"
          WORK=$(mktemp -d)
          unzip -o -q "$APK" 'lib/*/*.so' -d "$WORK"
          FAIL=0
          for so in "$WORK"/lib/*/*.so; do
            MAXSYM=$(readelf -V "$so" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1 || true)
            if [ -n "$MAXSYM" ]; then
              VER=${MAXSYM#GLIBC_}
              MAJOR=${VER%%.*}; MINOR=${VER##*.}
              echo "$(basename "$so"): max ${MAXSYM}"
              if [ "$MAJOR" -gt 2 ] || { [ "$MAJOR" -eq 2 ] && [ "$MINOR" -gt 35 ]; }; then
                echo "ERROR: $so requires GLIBC_${VER} > 2.35 - package would not load"
                FAIL=1
              fi
            else
              echo "$(basename "$so"): no GLIBC version deps (bionic/NDK) OK"
            fi
          done
          test -f "$WORK/lib/arm64-v8a/libsherpa-onnx-jni.so"
          exit $FAIL

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TypeFree-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

  release:
    # Reuses the latest green main build - tag publish takes ~1 minute, no rebuild
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Locate latest successful main build and verify it matches this tag
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --branch main --workflow build.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful main build found - push main first"
            exit 1
          fi
          BUILD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')
          if [ "$BUILD_SHA" != "${{ github.sha }}" ]; then
            echo "::error::Latest main build ($BUILD_SHA) does not match tag commit (${{ github.sha }}). Tag the same commit that has a green main build."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Reusing artifact from run $RUN_ID (commit ${BUILD_SHA:0:7})"

      - name: Download APK artifact from main build (no rebuild)
        uses: actions/download-artifact@v4
        with:
          name: TypeFree-apk
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
          path: apk

      - name: Re-verify APK (GLIBC guard on the exact release artifact, exits 1 on failure)
        run: |
          set -euo pipefail
          APK=$(ls apk/*.apk | head -1)
          echo "Verifying release artifact $APK"
          unzip -t "$APK" > /dev/null
          BADGING="$("$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$APK" 2>/dev/null || true)"
          if [ -z "$BADGING" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq aapt > /dev/null
            BADGING=$(aapt dump badging "$APK")
          fi
          echo "$BADGING" | grep -E "^package: name='com.typefree.ime'"
          WORK=$(mktemp -d)
          unzip -o -q "$APK" 'lib/*/*.so' -d "$WORK"
          FAIL=0
          for so in "$WORK"/lib/*/*.so; do
            MAXSYM=$(readelf -V "$so" 2>/dev/null | grep -oE 'GLIBC_2\.[0-9]+' | sort -uV | tail -1 || true)
            if [ -n "$MAXSYM" ]; then
              VER=${MAXSYM#GLIBC_}
              MAJOR=${VER%%.*}; MINOR=${VER##*.}
              echo "$(basename "$so"): max ${MAXSYM}"
              if [ "$MAJOR" -gt 2 ] || { [ "$MAJOR" -eq 2 ] && [ "$MINOR" -gt 35 ]; }; then
                echo "ERROR: $so requires GLIBC_${VER} > 2.35 - package would not load"
                FAIL=1
              fi
            else
              echo "$(basename "$so"): no GLIBC version deps (bionic/NDK) OK"
            fi
          done
          test -f "$WORK/lib/arm64-v8a/libsherpa-onnx-jni.so"
          exit $FAIL

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" apk/*.apk --repo "$GITHUB_REPOSITORY" \
            --title "TypeFree ${{ github.ref_name }} - 本地离线 SenseVoice 引擎" \
            --generate-notes \
            --notes "## 本地离线语音识别引擎

          本版本在云端流式 ASR（Gemini Live / 百炼 / 豆包 / OpenAI 兼容）之外，新增**完全离线**的本地识别引擎：

          - FunASR SenseVoice-Small (int8 ONNX, ~230MB) 直接内嵌 APK assets，安装即用
          - silero VAD 分句准流式：说完整句（约 0.45s 停顿）即出字，20s 长句自动切段
          - 中 / 粤 / 英 / 日 / 韩自动检测，自带标点与数字规整
          - 无需任何 API Key、零联网、零费用，语音不出手机
          - 首次使用需加载模型（约 2-4s），推理峰值内存约 300MB，建议 6GB+ 内存设备

          ## 安装

          下载下方 APK 直接安装（debug 签名测试版，如需覆盖安装请先卸载旧版）。"
